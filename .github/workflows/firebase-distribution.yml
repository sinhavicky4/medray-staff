name: Firebase App Distribution (MedRay Staff)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      groups:
        description: 'Target Tester Groups (comma separated)'
        required: true
        default: 'pilot-doctors'

permissions:
  contents: write

jobs:
  distribute:
    name: Build & Distribute to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$GITHUB_WORKSPACE/release.jks" \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" > "$GITHUB_WORKSPACE/keystore.properties"
          fi

      # local.properties is gitignored like keystore.properties above, so it
      # never exists on this runner — without this, BuildConfig.PLACES_API_KEY
      # silently compiles to "" and PlacesAutocompleteRepository always
      # returns an empty suggestion list on every distributed build (no
      # crash, no error, address autocomplete just never shows anything).
      - name: Write local.properties (Places API key)
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          if [ -n "$PLACES_API_KEY" ]; then
            echo "PLACES_API_KEY=$PLACES_API_KEY" >> "$GITHUB_WORKSPACE/local.properties"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Determine Release Notes
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "notes=MedRay Staff Android Release ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate Built APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID || '1:43389690359:android:4a7a3246c5c132fcb10ef2' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          groups: ${{ github.event.inputs.groups || 'pilot-doctors' }}
          releaseNotes: ${{ steps.notes.outputs.notes }}
          file: ${{ steps.apk.outputs.apk_path }}

      - name: Create or Update GitHub Release with Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "${{ steps.apk.outputs.apk_path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.apk_path }}" \
              --title "MedRay Staff $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medray-staff-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
